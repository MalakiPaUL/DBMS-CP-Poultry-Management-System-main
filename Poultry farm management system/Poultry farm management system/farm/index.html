<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Static preview of the Poultry Farm Management System sign-in page.">
    <title>Poultry Farm Management System</title>
    <link rel="stylesheet" href="assets/vendors/css/vendor.bundle.base.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="shortcut icon" href="companyimages/head.png">
</head>
<body>
    <main class="container-scroller">
        <div class="container-fluid page-body-wrapper full-page-wrapper">
            <section class="content-wrapper d-flex align-items-center auth">
                <div class="row flex-grow">
                    <div class="col-lg-4 mx-auto">
                        <div class="auth-form-light text-left p-5">
                            <div class="brand-logo text-center">
                                <img class="img-avatar mb-3"
                                     src="companyimages/poultrylogo.png"
                                     alt="Poultry Farm Management System">
                            </div>
                            <h1 class="h4 text-center mb-4">Sign in</h1>
                            <p class="text-center">
                                Static preview only. Sign-in requires the PHP application
                                and its database.
                            </p>
                            <div class="form-group mb-3">
                                <label class="sr-only" for="username">Username</label>
                                <input class="form-control form-control-lg"
                                       id="username"
                                       type="text"
                                       placeholder="Username"
                                       disabled>
                            </div>
                            <div class="form-group mt-3">
                                <label class="sr-only" for="password">Password</label>
                                <input class="form-control form-control-lg"
                                       id="password"
                                       type="password"
                                       placeholder="Password"
                                       disabled>
                            </div>
                            <div class="mt-3">
                                <button class="btn btn-block btn-gradient-primary btn-lg font-weight-medium auth-form-btn"
                                        type="button"
                                        disabled>
                                    SIGN IN
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>
</body>
</html>
